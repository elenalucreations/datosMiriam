<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F5EFE3">

  <title>Datos de pago | Miriam</title>

  <style>
    :root {
      --beige: #F5EFE3;
      --beige-light: #FFFCF6;
      --mint: #A8DCC8;
      --mint-dark: #397B65;
      --text: #3D463F;
      --muted: #777D75;
      --border: #E5E0D4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--beige);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 30px 24px;
      text-align: center;
      background: var(--beige-light);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(79, 89, 72, 0.08);
    }

    .logo {
      display: block;
      width: 150px;
      max-width: 75%;
      max-height: 150px;
      object-fit: contain;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .data-card {
      margin-bottom: 14px;
      padding: 18px 14px;
      background: #F8F5EC;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      background: var(--mint);
      color: #244C3E;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #91D0B8;
    }

    button:active {
      transform: scale(0.98);
    }

    .status {
      min-height: 20px;
      margin-top: 10px;
      color: var(--mint-dark);
      font-size: 13px;
      font-weight: 600;
    }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">

    <img
      class="logo"
      src="logomiriampng.png"
      alt="Logo de Miriam"
    >

    <h1>Datos para tu pago</h1>

    <p class="subtitle">
      Copia los datos y realiza tu transferencia.
    </p>

    <section class="data-card">
      <span class="label">Nombre de la titular</span>
      <span class="value" id="nombre">
        Miriam Duarte García
      </span>

      <button type="button" onclick="copiar('nombre')">
        Copiar nombre
      </button>
    </section>

    <section class="data-card">
      <span class="label">Número de tarjeta</span>
      <span class="value" id="tarjeta">
        4152314362145313
      </span>

      <button type="button" onclick="copiar('tarjeta')">
        Copiar número de tarjeta
      </button>
    </section>

    <div class="status" id="estado" role="status"
         aria-live="polite"></div>

    <p class="footer">
      Verifica los datos antes de confirmar tu transferencia.
    </p>

  </main>

  <script>
    async function copiar(id) {
      const texto = document.getElementById(id).textContent.trim();
      const estado = document.getElementById("estado");

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(texto);
        } else {
          const campo = document.createElement("textarea");
          campo.value = texto;
          campo.style.position = "fixed";
          campo.style.opacity = "0";
          document.body.appendChild(campo);
          campo.select();

          const correcto = document.execCommand("copy");
          campo.remove();

          if (!correcto) {
            throw new Error("No se pudo copiar");
          }
        }

        estado.textContent =
          id === "nombre"
            ? "Nombre copiado correctamente"
            : "Número de tarjeta copiado correctamente";

      } catch (error) {
        estado.textContent =
          "No se pudo copiar. Mantén presionado el dato para copiarlo.";
      }
    }
  </script>
</body>
</html>
